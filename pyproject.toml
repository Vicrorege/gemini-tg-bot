[project]
name = "gemini-tg-bot"
version = "0.1.0"
description = "Full-featured Telegram bot with Google Gemini / Antigravity backend, real-time web search, sessions, context compression, streaming, and vision support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.17.0",
    "aiohttp-socks>=0.8.4",
    "openai>=1.60.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "tiktoken>=0.8.0",
    "pypdf>=5.1.0",
    "aiohttp>=3.10.0",
    "python-dotenv>=1.0.0",
    "ddgs>=9.0.0",
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
